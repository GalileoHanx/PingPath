name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # Same-repo pull requests are already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: tools/check-anti-ban-rules.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # The client targets Windows first, so the workspace must build there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Allow unprivileged ICMP so the probe's ICMP tests run
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo test --workspace --locked

  netsim:
    # Traceroute through real routers: tools/netsim/three-hop.sh builds a
    # client -> router -> router -> server network out of namespaces.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the probe tests
        id: build
        run: |
          bin=$(cargo test --locked -p pingpath-probe --test probe_end_to_end --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "probe_end_to_end" and .executable != null) | .executable')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - run: sudo tools/netsim/three-hop.sh up
      - run: sudo ip netns exec ppclient "${{ steps.build.outputs.bin }}" --ignored multi_hop

  client-netns:
    # PLAN.md Phase 3's done-when criteria on a real kernel: the engine with
    # its Linux backend (a TUN device and kernel routes), real relays and a
    # control plane, each in a namespace from tools/netsim/client-netsim.sh.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the client netns test
        id: build
        run: |
          bin=$(cargo test --locked -p pingpath-client-core --test netns --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "netns" and .executable != null) | .executable')
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - run: sudo tools/netsim/client-netsim.sh up --no-direct-exit
      - run: sudo ip netns exec ppgame "${{ steps.build.outputs.bin }}" --ignored --test-threads=1 --nocapture

  relay-latency:
    # PLAN.md Phase 2: relay processing adds under 1 ms at the 99th
    # percentile. Debug builds are too slow to measure that, so the test
    # runs here in release mode.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release -p pingpath-relay --test end_to_end added_latency -- --nocapture

  images:
    # The relay and control plane images, plus their Linux binaries for
    # operators who install without Docker (infra/install-relay.sh, the
    # Terraform modules' binary_url).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/Dockerfile --target relay -t pingpath-relay:ci .
      - run: docker build -f infra/docker/Dockerfile --target control -t pingpath-control:ci .
      - name: Smoke-test the images
        run: |
          docker run --rm pingpath-relay:ci --version
          docker run --rm pingpath-control:ci --version
      - name: Extract the Linux binaries
        run: |
          mkdir dist
          for name in relay control; do
            id=$(docker create pingpath-$name:ci)
            docker cp "$id:/usr/local/bin/pingpath-$name" dist/
            docker rm "$id"
          done
          cd dist && sha256sum pingpath-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: pingpath-linux-x64
          path: dist/

  terraform:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate every module and example
        run: |
          for dir in infra/terraform/modules/* infra/terraform/examples/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: Check the systemd units
        run: |
          for unit in infra/systemd/*.service; do
            sed "s|/usr/local/bin/|/usr/bin/|g; s|pingpath-relay |true |; s|pingpath-control |true |" "$unit" > "/tmp/$(basename "$unit")"
          done
          systemd-analyze verify /tmp/pingpath-*.service

  windows-binaries:
    # Ready-to-run .exe files for testers, downloadable from the run's
    # Artifacts section.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    env:
      # Link the C runtime statically so testers don't need a VC++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p pingpath-probe -p pingpath-diagnostics --bins
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/pingpath-probe.exe, target/release/pingpath-report.exe, tools/windows/HOW-TO-TEST.txt dist/
          dist/pingpath-probe.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: pingpath-windows-x64
          path: dist/

  game-definitions:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate games/*.yaml against games/schema.json and PLAN.md rules
        run: cargo run --locked -p pingpath-games -- validate games
