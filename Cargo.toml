[workspace]
resolver = "3"
members = [
    "client/core",
    "control",
    "crates/diagnostics",
    "crates/games",
    "crates/tunnel",
    "relay",
    "tools/probe",
]
# The Tauri app is a workspace of its own (see client/ui/Cargo.toml): Linux
# CI has no WebKitGTK, so it is built and linted on Windows only.
exclude = ["client/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pingpath-diagnostics = { path = "crates/diagnostics" }
pingpath-games = { path = "crates/games" }
pingpath-tunnel = { path = "crates/tunnel" }

axum = "0.8"
base64 = "0.22"
boringtun = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2.12", features = ["serde"] }
jsonschema = { version = "0.58", default-features = false }
nix = "0.31"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = "3"
windows-sys = "0.61"

[workspace.lints.rust]
# The Wintun bindings in the client will need a scoped `#[allow(unsafe_code)]`;
# everything else stays safe Rust.
unsafe_code = "deny"
