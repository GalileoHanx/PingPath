[package]
name = "pingpath-client-core"
description = "PingPath client engine: split-tunnel routes, path selection, the fail-open watchdog, and the Windows (Wintun) and Linux (TUN) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pingpath-diagnostics.workspace = true
pingpath-games.workspace = true
pingpath-probe = { path = "../../tools/probe" }
pingpath-tunnel.workspace = true
base64.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
# Bindings to wintun.dll, loaded at run time from the install folder.
# Why this crate and not wintun-bindings: see net/windows/mod.rs.
wintun = "=0.5.1"
# Deleting the service Wintun's driver leaves at uninstall (net/windows/driver.rs).
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_Rras",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["ioctl", "net"] }

[dev-dependencies]
pingpath-control = { path = "../../control" }
pingpath-relay = { path = "../../relay" }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["ioctl", "net", "sched"] }

[lints]
workspace = true
