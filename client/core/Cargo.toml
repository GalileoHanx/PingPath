[package]
name = "pingpath-client-core"
description = "PingPath client engine: split-tunnel routes, path selection, the fail-open watchdog, and the Windows (Wintun) and Linux (TUN) backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pingpath-diagnostics.workspace = true
pingpath-games.workspace = true
pingpath-probe = { path = "../../tools/probe" }
pingpath-tunnel.workspace = true
base64.workspace = true
ipnet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["ioctl", "net"] }

[dev-dependencies]
pingpath-control = { path = "../../control" }
pingpath-relay = { path = "../../relay" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["ioctl", "net", "sched"] }

[lints]
workspace = true
