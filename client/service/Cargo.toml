[package]
name = "pingpath-service"
description = "PingPath client service: runs the engine as a Windows service and serves the UI over a named pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pingpath-client-core = { path = "../core" }
pingpath-diagnostics.workspace = true
pingpath-games.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
