notes: |
  PLACEHOLDER server ranges (RFC 5737 documentation addresses). The validator
  accepts them only for games that are never routed (untested, unsupported),
  so this game cannot be routed until verified ranges replace them.

  Game traffic goes through Valve's Steam Datagram Relay (SDR). Valve
  publishes the relay addresses and ports per app at
  https://api.steampowered.com/ISteamApps/GetSDRConfig/v1/?appid=570
  pingpath-probe reads that list live for the sdr_pops above, and
  `pingpath-probe sdr-import dota-2` prints the ranges to paste here.
  SDR already carries traffic over Valve's own backbone, so measure whether
  PingPath helps before moving past untested.

  Ports: UDP 27000-27100 is the game-traffic range in Valve's "Required
  ports for Steam" FAQ. Confirm against the SDR config.
