# Kernel settings for a PingPath relay. Install to /etc/sysctl.d/ and run
# `sysctl --system`.

# The exit opens one UDP socket per flow from the ephemeral range: make it
# comfortably larger than limits.max_flows (default 20,000) ...
net.ipv4.ip_local_port_range = 10000 65000
# ... and keep the relay's own ports out of it, so no flow socket can take
# them while the relay restarts.
net.ipv4.ip_local_reserved_ports = 51820,9100

# Room for bursts on the shared UDP socket.
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 5000

# Exits measure their game regions' ICMP ping targets without root, through
# ping sockets (TCP targets need nothing).
net.ipv4.ping_group_range = 0 2147483647
